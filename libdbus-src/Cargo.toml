[package]
name = "libdbus-src"
version = "0.1.0"
authors = ["David Henningsson <diwic@ubuntu.com>"]
edition = "2018"

description = "A vendored libdbus."
repository = "https://github.com/diwic/dbus-rs"
documentation = "https://docs.rs/libdbus-src"
keywords = ["D-Bus", "DBus", "libdbus"]
license = "Apache-2.0/MIT"
categories = ["os::unix-apis"]
build = "build.rs"
readme = "README.md"

exclude = ["/vendor/dbus/tools/", "/vendor/dbus/test/", "/vendor/dbus/maint/"]

[build-dependencies]
cc = "1.0.78"
